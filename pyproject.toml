[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "brocker"
version = "2.0.0"
description = "Forex AI Quantitative Trading Platform — DDD + Event-Driven + Hexagonal"
authors = []
packages = [{include = "brocker", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# AI
anthropic = ">=0.25.0"

# ML
xgboost = ">=2.0.0"
scikit-learn = ">=1.4.0"
joblib = ">=1.3.0"

# Technical Analysis
pandas-ta = ">=0.3.14b"
pandas = ">=2.1.0"
numpy = ">=1.26.0"

# Config
pydantic-settings = ">=2.2.0"
pydantic = ">=2.6.0"

# CLI
typer = { version = ">=0.12.0", extras = ["all"] }

# API / Health
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.29.0", extras = ["standard"] }

# Database
sqlalchemy = { version = ">=2.0.28", extras = ["asyncio"] }
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"

# Retry
tenacity = ">=8.2.0"

# Knowledge ingestion
pypdf = ">=4.0.0"

# Event bus (production)
redis = ">=5.0.0"

# RL environment
gymnasium = ">=0.29.0"

# Structured logging
structlog = ">=24.0.0"

# Windows-only broker connector (optional — skipped on Linux/Docker)
MetaTrader5 = { version = ">=5.0.45", optional = true, markers = "sys_platform == 'win32'" }

[tool.poetry.extras]
mt5 = ["MetaTrader5"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-asyncio = ">=0.23.0"
pytest-mock = ">=3.14.0"
httpx = ">=0.27.0"

[tool.poetry.scripts]
brocker = "brocker.__main__:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
