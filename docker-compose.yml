services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brocker
      POSTGRES_USER: brocker
      POSTGRES_PASSWORD: brocker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brocker -d brocker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brocker.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama    # persist downloaded models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "llama3.1:8b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "alembic"]
    command: ["upgrade", "head"]
    restart: "no"

  brocker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db          # override: points at postgres container
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      NUMBA_CACHE_DIR: /tmp/numba_cache
      OLLAMA_URL: http://ollama:11434   # internal Docker network
      AI_PROVIDER: ollama
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models         # ML model artifacts
      - ./docs/knowledge:/app/docs/knowledge  # documents to ingest
    command: ["serve"]               # start API server by default

  backtest:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      PYTHONPATH: /app/src
      NUMBA_CACHE_DIR: /tmp/numba_cache
      OLLAMA_URL: http://ollama:11434
      AI_PROVIDER: ollama
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    profiles:
      - backtest
    command: ["backtest", "--symbol", "EURUSD", "--timeframe", "H1"]

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
