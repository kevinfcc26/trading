services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brocker
      POSTGRES_USER: brocker
      POSTGRES_PASSWORD: brocker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brocker -d brocker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brocker.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  brocker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db          # override: points at postgres container
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models         # ML model artifacts
      - ./docs/knowledge:/app/docs/knowledge  # documents to ingest
    command: ["serve"]               # start API server by default

  backtest:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - backtest
    command: ["backtest", "--symbol", "EURUSD", "--timeframe", "H1"]

volumes:
  postgres_data:
